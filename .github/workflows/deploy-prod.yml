name: Deploy Production

# Runs only after a PR is merged into main (a direct push to main is blocked by the branch rule).
on:
  push:
    branches: [main]

# Never run two production deploys at the same time; wait for the first one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# NOTE: these jobs upload the source and let Vercel build it on Vercel's own servers
# (no "vercel pull" / "--prebuilt"). That way Vercel can read every environment variable,
# including ones marked Sensitive, which "vercel pull" cannot download.

jobs:
  # Step A: deploy the two remotes (products and cart) in parallel
  remotes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [products, cart]
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ matrix.app == 'products' && secrets.VERCEL_PRODUCTS_ID || secrets.VERCEL_CART_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes vercel@latest deploy --prod --yes

  # Step B: deploy the host only after both remotes succeeded
  host:
    needs: remotes
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_HOST_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes vercel@latest deploy --prod --yes
