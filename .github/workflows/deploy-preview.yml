name: Deploy Preview

on:
  pull_request:

jobs:
  # Step A: deploy the two remotes (products and cart) in parallel
  remotes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [products, cart]
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ matrix.app == 'products' && secrets.VERCEL_PRODUCTS_ID || secrets.VERCEL_CART_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dlx vercel pull --yes --environment=preview
      - run: pnpm dlx vercel build
      - run: pnpm dlx vercel deploy --prebuilt

  # Step B: deploy the host only after both remotes succeeded
  host:
    needs: remotes
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_HOST_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dlx vercel pull --yes --environment=preview
      - run: pnpm dlx vercel build
      - run: pnpm dlx vercel deploy --prebuilt
